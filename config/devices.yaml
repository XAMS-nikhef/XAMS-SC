# Device connection and identity. See DESIGN.md §4.1, §6.2.
#
# Device resolution NEVER uses a COM number. Candidates are narrowed by USB
# hardware ID, then the instrument is asked who it is. For the CAEN units that
# second step is the only identification — they expose no USB serial number.

cdaq:
  chassis: cDAQ1
  serial: "020C5E1C"          # confirmed present on the lab PC, 17 Sep 2026
  modules:
    - {alias: "9207",   model: NI9207, slot: 1, serial: "020DFD57"}
    - {alias: "9216_1", model: NI9216, slot: 2, serial: "020F64D1", background: true, interval_s: 5}
    - {alias: "9216_2", model: NI9216, slot: 3, serial: "020F64D0", background: true, interval_s: 5}
    - {alias: "9226",   model: NI9226, slot: 4, serial: "02159CBB", background: true, interval_s: 10,
       switch: pt1000, label: "PT1000 readout"}
  # `background: true` (21 October 2026): the RTD modules are read in their own
  # thread every `interval_s` seconds instead of in the 1-s loop. An RTD read
  # takes seconds; in the loop it left fewer 9207 readings in each 10-s mean
  # and p102-p104 came out 3.5x noisier as soon as the 9226 was read again.
  # Temperatures change slowly, so 5 s is plenty. The 9207 stays in the loop.
  # The 9226 (21 October 2026, later): in the background p102-p104 were still
  # ~2x the morning noise - the 9226 converting disturbs the 9207 itself, not
  # only by taking loop time. So it is read every 10 s and with `adc_timing:
  # high_speed` (default is high resolution, 1.2 s per read of 6 channels):
  # shorter conversions, less of the time converting. Resolution is not needed.
  # High speed was REVERTED the same afternoon (user): the temperatures jumped
  # up and down with it. Back to the DAQmx default (high resolution); the
  # 10-s interval stays. `adc_timing` remains available per module.
  # `switch` (26 October 2026): the 9226 readout can be switched off and on
  # while running - from the Control page or `xams-ctl readout pt1000 off`.
  # With the HV on the PT1000s are disconnected and grounded; off closes the
  # task, so they are not read, not published and not alarmed on (they show
  # as "off"). The state is kept in data/cdaq_readout.json across restarts.
  # `label` is what the pages call it.
  # RTD excitation current, measured from the hardware 17 Sep 2026. Each module
  # accepts EXACTLY ONE value and neither is the DAQmx default of 2.5 mA, so
  # both must be set explicitly or the task refuses to configure. Kept here for
  # the record; the driver holds the same values in EXCITATION_A.
  #   NI9226 (PT1000): 100 uA only   — 1 mA and 2.5 mA both refused
  #   NI9216 (PT100):  1 mA only     — 100 uA and 2.5 mA both refused

caen:
  # Verified on the lab PC, 17 September 2026. CAEN's own VID/PID, not FTDI;
  # Windows enumerates both as a generic "USB Serial Device" (usbser.sys).
  # Neither unit carries a USB serial number — the instance path
  # (5&35CD27EE&0&5) is a hub socket and changes if the cable is moved.
  # Identity therefore rests entirely on the BDSNUM query (§6.2).
  - id: hv_1
    match: {vid: "21E1", pid: "0003"}
    board_address: 0
    board_name: DT1470ET       # checked together with the serial (§6.2 rule 2)
    board_serial: "19198"
    firmware: "1.08"           # informational; logged, alarmed on change
    baud: 9600
    # PMT bottom / PMT top / top screen / bottom screen — all negative.
    #
    # `expect` is what these channels were found set to on 17 Sep 2026. The
    # software READS these at startup and ALARMS on a mismatch; it never
    # writes them (§8.3, §10 rule 2). Ramp rate, trip current and over-voltage
    # limit are configured on the instrument and stay there — that is what
    # keeps the software out of the protection path.
    #
    # ISET (current limit), set by AP on 14 October 2026: 10 uA on the screens
    # and electrodes, 20 uA on the two PMTs - their bases draw ~7.6 uA at -950 V
    # on their own, and under Cs load the anode current adds ~55 % of that
    # (1 October analysis), ~12 uA in all: 10 uA would limit them.
    # Ramp rates set on the supplies by AP on 14 October 2026: PMTs up 10 V/s,
    # screens (and electrodes) up 25 V/s, everything down 50 V/s. Slower up
    # than down on purpose: a breakdown announces itself in IMON while the
    # voltage rises, and 25 V/s leaves time to see it.
    expect:
      0: {pol: "-", maxv: 1100, rup: 10, rdw: 50,  trip: 10.0, iset: 20}
      1: {pol: "-", maxv: 1100, rup: 10, rdw: 50,  trip: 10.0, iset: 20}
      2: {pol: "-", maxv: 1710, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
      3: {pol: "-", maxv: 2000, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
    # TRIP (the time a channel may sit at its ISET before switching off) is
    # 10 s on every channel since 14 October 2026; the bottom PMT's 2 s was
    # history, not intent (AP).
  - id: hv_2
    match: {vid: "21E1", pid: "0003"}
    board_address: 0           # BOTH units are address 0: two separate USB
    board_name: DT1470ET       # connections, not a daisy chain
    board_serial: "79"
    firmware: "1.04"
    baud: 9600
    # cathode / gate / anode / SiPM equalizer since 28 October 2026: cathode,
    # gate and equalizer negative, anode positive. The gate is back on channel
    # 1 (it was on channel 3, positive, 14-28 October for CM-B); channel 3's
    # polarity was switched to - on the board for the SiPM equalizer and keeps
    # MAXV 1000, ISET 10. Channel 1 (the gate) "same as the others" (user,
    # 28 October 2026): MAXV 4000 like the cathode, ISET 10, TRIP 10, 25/50.
    # Read and alarmed on mismatch, never written (§8.3).
    expect:
      0: {pol: "-", maxv: 4000, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
      1: {pol: "-", maxv: 4000, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
      2: {pol: "+", maxv: 4500, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
      3: {pol: "-", maxv: 1000, rup: 25, rdw: 50,  trip: 10.0, iset: 10}
    # Channels plotted on /hv without their current: none since 14 October
    # 2026, when channel 3 went from the NaI (whose base divider current set
    # the scale) to the gate, whose current matters.
    plot_without_imon: []

lakeshore:
  match: {vid: "1FB9", pid: "0300", serial: "335A12T"}
  idn_contains: "MODEL335"
  # Confirmed working 17 Sep 2026: 57600 baud, 7 data bits, ODD parity, 1 stop.
  # 7-O-1 is the 335 factory setting and is not a typo. At 8-N-1 the port opens
  # and the instrument returns nothing intelligible, which looks like a dead
  # instrument rather than a wrong setting.
  baud: 57600
  # *IDN? answers 'LSCI,MODEL335,335A12T/#######,1.2'. The third field is
  # <instrument serial>/<option card serial>; only the part before the slash
  # identifies the unit, and it matches the USB descriptor serial above.
  # Settings read at startup, 17 Sep 2026 (displayed and alarmed on, never
  # written - section 8.3):
  #   output 1: setpoint -90.000  range 3  PID 100, 20, 0
  #   output 2: setpoint -100.00  range 0  PID 50, 20, 120

ups:
  # APC, confirmed on the lab PC 17 Sep 2026. Reports itself as
  # "Legacy Communication Card FW:LCC 03.1 / ID=5004".
  #
  # READ DIRECTLY FROM THE HID, alongside PowerChute Personal Edition 3.1.0.
  # HID input is shareable on Windows, so PowerChute keeps doing its
  # safe-shutdown job and this service just reads the same feature reports.
  #
  # The two routes that do NOT work here, recorded so nobody retries them:
  #   Win32_Battery and the other WMI battery classes report no instances.
  #   GetSystemPowerStatus answers but says BatteryFlag=128, "no system
  #     battery" - its ACLineStatus describes the wall socket, not the UPS,
  #     and would read "on line power" while the UPS ran on battery.
  #
  # Status at startup, 17 Sep 2026: ACPresent=1, battery 100%,
  # RunTimeToEmpty 1579 s (26 min), not discharging, no replacement needed.
  model: "APC Legacy Communication Card"
  match: {vid: "051D", pid: "0002", serial: "3S2005X18782"}
  connection: usb-hid

turbo:
  # Pfeiffer HiPace 80 (TC 110 electronics) in a HiCube 80 Eco pumping
  # station. Read by LISTENING on the RS-485 link between the pump and its
  # DCU, via a Pfeiffer M12 Y-piece and an EXSYS EX-13009 USB/RS-485 adapter
  # (FTDI). Connected and checked 2026-10-08. See docs/drivers/turbo.md.
  #
  # NOTHING IS EVER SENT. The DCU is the bus master; this service only reads
  # its polls and the pump's replies.
  #
  # The serial is what pyserial reports for the FTDI port: the USB serial
  # DIBIURQ3 plus the interface letter A. Windows shows the adapter as
  # USB\VID_0403&PID_6001\DIBIURQ3 (COM7 at the time).
  model: "Pfeiffer HiPace 80 / TC 110, via EXSYS EX-13009 RS-485 tap"
  match: {vid: "0403", pid: "6001", serial: "DIBIURQ3A"}
  connection: rs485-listen-only
  baud: 9600          # Pfeiffer protocol: 9600 8N1
  address: 1          # the pump's RS-485 address (parameter 797)
  # A parameter not seen for this long is published as quality=error. The DCU
  # polls each one about twice a second.
  max_age_s: 5
  # Startup listens this long for a valid reply before refusing to start.
  identify_s: 5

scale:
  # LN2 dewar scale: All Scales Europe ISCI weight indicator, 600 kg x 0.05 kg,
  # S/N 0100164095. Inside it is a Dini Argeo DFW: `VER` answers
  # "VER,311,DFW06" (firmware 3.11). Read over the RS-232 PC port - the RJ45
  # socket on the back, which is NOT Ethernet - with the supplier's RJ45-USB
  # cable (FTDI). Connected and checked 2026-10-21. See docs/drivers/scale.md.
  #
  # Factory serial settings, nothing changed on the indicator: PC port mode
  # `ondE` (answers on request), 9600 baud, 8-N-1, CR LF.
  #
  # QUERIES ONLY. The protocol also has tare, zero, key presses and display
  # messages; the driver sends only the commands in its whitelist.
  #
  # The serial is what pyserial reports for the FTDI port: the USB serial
  # AU05TI3P plus the interface letter A (COM8 at the time). The turbo's RS-485
  # tap has the SAME vid:pid, so the port is chosen by this serial BEFORE
  # anything is written to it - a probe on the turbo's port would put bytes on
  # the pump's bus.
  model: "All Scales Europe ISCI (Dini Argeo DFW06)"
  match: {vid: "0403", pid: "6001", serial: "AU05TI3PA"}
  idn_contains: "DFW06"
  connection: rs232
  baud: 9600

rga:
  # Pfeiffer PrismaPro QMG 250 residual gas analyser on the pre-volume, on the
  # lab Ethernet. HTTP/JSON ("MMSP") on port 80. Read-only discovery
  # 2026-10-13, see docs/drivers/rga.md.
  #
  # STEP 1: STATUS ONLY. The service takes no control and writes nothing; its
  # HTTP client has no write method.
  #
  # Identity: the analyser must report exactly this name and serial, or the
  # service refuses to start. The address alone identifies nothing.
  model: "Pfeiffer PrismaPro QMG 250 A 200 (CDEM, yttria-iridium filaments)"
  host: 192.16.192.86     # prismapro-xams-rga.nikhef.nl
  port: 80
  match: {name: "RGA PrismaPro A 200 47504651", serial: "47504651"}
  connection: ethernet-http
  timeout_s: 5
  # One request per target, over one kept-alive connection; a cycle takes
  # about 0.7 s. Status every 5 s is plenty, and the device drops requests
  # that come too fast.
  read_interval_s: 5
  # The p105 GUARD for emission (docs/drivers/rga.md, step 3). A software
  # guard on top of the analyser's own over-pressure trip, not an interlock.
  # Emission On is refused unless p105 is fresh and below the limit; the
  # service switches emission Off at once at the limit, after the grace when
  # p105 stops arriving, and after emission_idle_off_s without a scan or a
  # command. Limit 4e-4 mbar, a little under the datasheet's 5e-4 for the
  # Faraday cup; the service refuses to start with more than 5e-4.
  # A.P. Colijn, 13 October 2026 (was 5e-4 the same day).
  guard_channel: p105
  guard_limit_mbar: 4.0e-4
  guard_max_age_s: 30
  guard_grace_s: 60
  emission_idle_off_s: 3600
  # The ELECTRON MULTIPLIER's own limit on the same p105 (step 4). EM On is
  # refused unless emission is on and p105 is fresh and below it; the service
  # switches the EM Off at once at the limit, after the same grace when p105
  # stops arriving, and always before emission goes off. Limit 4e-5 mbar, a
  # little under the datasheet's 5e-5 with the C-SEM on. The service refuses
  # to start with a value above 5e-5 or above guard_limit_mbar.
  # A.P. Colijn, 13 October 2026 (was 1e-5 the same day).
  em_guard_limit_mbar: 4.0e-5
  # Has the analyser's stored EM gain been checked against the Faraday cup
  # (in PV MassSpec)? Until then EM values divided by it are relative only,
  # and the page says so. 13 October 2026: stored 1234.57 at 800 V, measured
  # |EM|/Faraday ~30 - not calibrated.
  em_gain_calibrated: false
  # Control is given back after this long without a scan or a command (not
  # while emission is on).
  release_idle_s: 300
