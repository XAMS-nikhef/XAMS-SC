# Alarm thresholds and severity routing. See DESIGN.md §4.3, §11.
#
# Four thresholds per channel, EPICS-style: lolo, low, high, hihi.
#
# THRESHOLDS ARE LARGELY TBD (§16) pending the `Error and Alarm` tab of the
# LabVIEW front panel. What is here is structure plus the staleness rules,
# which are independent of any physics threshold and are wanted from day one.
#
# Changing a threshold silently alters what the system protects against, so
# this file lives in git and is applied with `xams-ctl reload` — deliberately
# unlike recipients.yaml, which is edited from the web UI (§4.4).

defaults:
  hysteresis: 0.02          # fraction of range, prevents chatter
  min_repeat_minutes: 15    # re-notification interval while a condition persists
  stale_after_seconds: 60

# Staleness is an alarm at the same severity as a threshold breach: a dead
# sensor must not read as healthy (§11).
staleness:
  severity: major
  notify: [email]

channels:

  # ------------------------------------------------------------------
  # Detector pressure. Thresholds from A.P. Colijn, 17 September 2026.
  #
  # THE UNIT IS BAR, and this is where that was established — the limits were
  # given as "high 2.1 bar, hihi 2.5 bar, low 0.9 bar", which closes a §16
  # item open since the design was written. It was never guessed: §4.2 is
  # explicit that a wrong unit propagates into every plot, every threshold,
  # and eventually into a paper.
  #
  # For scale: pmain read 1.495 bar when these were set, so `high` is about
  # 40% above the working point and `low` about 40% below it.
  # ------------------------------------------------------------------
  pmain:
    low:  {value: 0.9, severity: minor, notify: [email]}
    high: {value: 2.25, severity: minor, notify: [email]}
    hihi: {value: 2.5, severity: major, notify: [sms, email, sound]}

  # ------------------------------------------------------------------
  # UPS. A power event is one of the few things that can end a run (§7.4),
  # so mains loss goes to SMS at once rather than waiting for the battery to
  # run down.
  #
  # ups_on_battery is 0 or 1, so a limit of 0.5 means "is 1". Written as an
  # ordinary threshold rather than a special case: everything else in this
  # file is a threshold, and one mechanism is easier to reason about than two.
  # ------------------------------------------------------------------
  ups_on_battery:
    high: {value: 0.5, severity: major, notify: [sms, email, sound]}

  # Charge and remaining runtime. These matter most while on battery, but they
  # are also how a failing battery announces itself on line power: a pack that
  # no longer holds charge reads low even while charging.
  #
  # Present values for scale: 100% and 26 minutes.
  ups_battery_pct:
    low:  {value: 50.0, severity: minor, notify: [email]}
    lolo: {value: 25.0, severity: major, notify: [sms, email]}

  ups_runtime_min:
    lolo: {value: 5.0, severity: major, notify: [sms, email]}

  # ------------------------------------------------------------------
  # Circulation pump outlets. Thresholds from A.P. Colijn, 17 September 2026.
  #
  # Both sides of the same pump: tt104 is the xenon leaving it, tt302 the
  # cooling water leaving it. They are the two places the pump announces that
  # it is running hot, which is why they are the only 1xx/3xx channels with
  # limits — the inlets (tt103, tt301) tell you about the process, the outlets
  # tell you about the pump.
  #
  # Working points when these were set: tt104 48.8 C, tt302 22.8 C, so `high`
  # sits about 11 C and 7 C above normal respectively.
  # ------------------------------------------------------------------
  tt104:
    high: {value: 60.0, severity: minor, notify: [email]}
    hihi: {value: 65.0, severity: major, notify: [sms, email, sound]}

  tt302:
    high: {value: 30.0, severity: minor, notify: [email]}
    hihi: {value: 35.0, severity: major, notify: [sms, email, sound]}

  # ------------------------------------------------------------------
  # LN2 dewar. Levels from A.P. Colijn, 21 October 2026: a warning below
  # 100 kg (time to order or fetch a refill), an alarm below 20 kg (nearly
  # empty). ln2_mass is the gross weight minus the empty dewar, 136.75 kg
  # (channels.yaml). At 2 % hysteresis the warning clears above 102 kg and
  # the alarm above 20.4 kg.
  #
  # SWITCHABLE (below): it can be switched off from the Control page while
  # the dewar is deliberately empty or away.
  # ------------------------------------------------------------------
  ln2_mass:
    low:  {value: 100.0, severity: minor, notify: [email]}
    lolo: {value: 20.0, severity: major, notify: [sms, email, sound]}

# Alarms that may be switched off ONE AT A TIME, from the Control page or
# with the arm command, for a condition that is expected for a while. Like
# the master switch on /alarms it stops only the notification: the alarm is
# still evaluated, shown on every page and recorded. A channel not listed
# here cannot be switched, whatever is sent. The switches are kept in
# data/alarm_armed.json and survive a restart.
switchable: [ln2_mass]

routing:
  sms:   {recipients: enabled}    # everyone enabled in recipients.yaml
  email: {recipients: enabled}
  sound: {}
