# Channel definitions — the single source of truth. See DESIGN.md §3, §4.2.
#
# Names are the identity of a measurement: MQTT topic, JSONL record, database
# row, UI label. THEY MUST BE STABLE FOREVER — renaming breaks history.
#
# Scaling is  value = (raw - offset) * multiplier  — the LabVIEW convention.
# Do not change it, or historical comparisons break (§4.2).
#
# Unconnected inputs are listed with `enabled: false` rather than omitted, so
# the map is complete and nobody has to wonder whether a gap is an oversight.

channels:

  # ------------------------------------------------------------------
  # NI 9207 — voltage inputs ai0:7. Offsets/multipliers recovered from the
  # LabVIEW front panel. Current inputs ai8:15 carry the strain gauges on
  # ai8/ai9; ai10:15 are listed disabled so the map stays complete (§7.1).
  # ------------------------------------------------------------------
  - name: p101
    device: cdaq
    phys: 9207/ai0
    kind: voltage
    offset: 1.0
    multiplier: 25.0
    unit: bar                 # §16 — must not be guessed
    legacy: P101
    description: gas rack high pressure side

  - name: p102
    device: cdaq
    phys: 9207/ai1
    kind: voltage
    unit: bar
    legacy: P102
    description: gas rack low pressure side

  - name: p103
    device: cdaq
    phys: 9207/ai2
    kind: voltage
    unit: bar
    legacy: P103
    description: pump inlet

  - name: p104
    device: cdaq
    phys: 9207/ai3
    kind: voltage
    unit: bar
    legacy: P104
    description: pump outlet

  - name: v4
    device: cdaq
    phys: 9207/ai4
    kind: voltage
    unit: V
    enabled: false
    legacy: v4
    description: not connected

  - name: pmain
    device: cdaq
    phys: 9207/ai5
    kind: voltage
    offset: 0.0
    multiplier: 0.714
    # BAR. Established 17 September 2026 from the alarm limits supplied by
    # A.P. Colijn ("high 2.1 bar, hihi 2.5 bar, low 0.9 bar"), not guessed --
    # the LabVIEW front panel shows "1.53" with no unit at all, which is why
    # this sat as TBD until somebody who knew said so (section 4.2, section 16).
    #
    # p101-p104 remain TBD. They are a different transducer with a different
    # multiplier and nothing here says anything about them.
    unit: bar
    legacy: Pmain
    description: detector pressure
    log_minmax: true

  # MOVED from ai7 to ai6 on 13 October 2026 (formerly the unconnected `v6`),
  # so that ai7, the last terminal on the WAGO jumper chain that ties every
  # AI- to COM, could be taken off that chain for the floating PKR signal
  # below. Same name, same scaling: the history and fm101_total continue.
  - name: fm101
    device: cdaq
    phys: 9207/ai6
    kind: voltage
    offset: 0.0
    multiplier: 6.0
    unit: g/min               # mass flow. NOT SLPM — the old label is wrong (§4.2)
    legacy: FM101
    description: flow meter — mass flow in grams per minute
    log_minmax: true

  # ------------------------------------------------------------------
  # PKR full-range gauge on the HiCube 80 Eco (P105; "P_pirani" on the P&ID
  # until it is relabelled). Its analog measuring signal is tapped from the
  # gauge cable (PT 448 250-T: brown = pin 2 signal, green = pin 3 signal
  # common) and read DIFFERENTIALLY on ai7, which is NOT on the AI-/COM jumper
  # chain: the gauge is powered by the DCU, not from this side, and tying its
  # signal common to COM would join two supply grounds (13 October 2026).
  # Wiring guide: reference/HiPace80/PKR_gauge_analog_tap_guide.pdf in the
  # maintainer's workspace.
  #
  # Two channels: the raw volts, kept so the measurement itself is archived,
  # and the pressure computed from it (scaling.pkr_pressure, PKR 251 manual
  # appendix A). Below 0.5 V or above 9.5 V the pressure is quality=error.
  #
  # On the P&ID in the gauge's bubble: tools/build_mimic.py relabels the
  # drawing's "P_pirani" to P105 (RELABEL) until the drawing itself is changed.
  # ------------------------------------------------------------------
  - name: p105_v
    device: cdaq
    phys: 9207/ai7
    kind: voltage
    unit: V
    on_pid: false
    description: PKR gauge measuring signal (raw)

  - name: p105
    device: cdaq
    phys: 9207/ai7
    kind: voltage
    unit: mbar
    derive: {from: p105_v, transform: pkr_pressure}
    log_minmax: true
    description: turbo / vacuum pressure, PKR full-range gauge

  # ------------------------------------------------------------------
  # NI 9207 current inputs ai8:15 — 4-20 mA loops.
  #
  # ai8/ai9 carry two strain gauge load cells, SG101 and SG102, added
  # 22 September 2026. Until then no current input was wired and no current
  # channel was read at all; DESIGN.md section 7.1 said so, and now does not.
  #
  # SCALING. DAQmx returns AMPS, so the raw number is 0.004 to 0.020, not 4
  # to 20. The transmitter is 4-20 mA over a full scale of 0-20 kg, so with
  # the standard  value = (raw - offset) * multiplier  convention (section 4.2):
  #
  #     offset     = 0.004          A at zero load
  #     multiplier = 20 kg / 0.016 A = 1250 kg/A
  #
  # A reading below 4 mA is not a light load: it is a broken loop, and the
  # driver publishes quality=error for it rather than a negative weight
  # (CURRENT_VALID_A in devices/cdaq.py).
  #
  # NOT YET CONFIRMED AGAINST THE SENSOR. The span and the full scale were
  # given to this software as "2x 4-20 mA strain gauge, 0-20 kg" and nothing
  # here has seen a datasheet or a reading. What that statement does NOT fix
  # is the DIRECTION: a reverse-acting transmitter sends 20 mA at zero load
  # and 4 mA at full scale, puts the same currents on the same wires, and
  # would make every weight below read as its complement -- 5 kg for 15.
  #
  # TO CONFIRM, with the loop powered: an empty cell must read close to
  # 4 mA (0 kg), and adding a known mass must move it UP. If it moves down,
  # the transmitter is reverse-acting: set offset 0.020 and multiplier -1250.
  #
  # THE LOOPS NEED EXTERNAL 24 V. The 9207 measures current but does not
  # source loop power. A channel reading a flat 0 mA with the sensor
  # connected is the supply, not the sensor.
  #
  # ON THE MIMIC. The P&ID already carries SG101 and SG102 as tagged
  # instruments, each with its own bubble, so they take a value slot like any
  # other point in the plant (section 8.2) - on_pid stays at its default of
  # true. The slots appeared as soon as these channels existed: the drawing is
  # the authoritative list of tags and tools/build_mimic.py sweeps it.
  #
  # `description` is what the gauges are: REVIEW IT. They were specified to
  # this software only as "2x 4-20 mA strain gauge, 0-20 kg" and what each
  # one is actually under was not stated (section 16).
  # ------------------------------------------------------------------
  - name: sg101
    device: cdaq
    phys: 9207/ai8
    kind: current
    offset: 0.004
    multiplier: 1250.0
    unit: kg
    description: mass bottle A

  - name: sg102
    device: cdaq
    phys: 9207/ai9
    kind: current
    offset: 0.004
    multiplier: 1250.0
    unit: kg
    description: mass bottle B

  # Spare current inputs. Nothing connected; no task line is created for them.
  - {name: spare_9207_ai10, device: cdaq, phys: 9207/ai10, kind: current, unit: A,
     enabled: false, description: "not connected"}
  - {name: spare_9207_ai11, device: cdaq, phys: 9207/ai11, kind: current, unit: A,
     enabled: false, description: "not connected"}
  - {name: spare_9207_ai12, device: cdaq, phys: 9207/ai12, kind: current, unit: A,
     enabled: false, description: "not connected"}
  - {name: spare_9207_ai13, device: cdaq, phys: 9207/ai13, kind: current, unit: A,
     enabled: false, description: "not connected"}
  - {name: spare_9207_ai14, device: cdaq, phys: 9207/ai14, kind: current, unit: A,
     enabled: false, description: "not connected"}
  - {name: spare_9207_ai15, device: cdaq, phys: 9207/ai15, kind: current, unit: A,
     enabled: false, description: "not connected"}

  # ------------------------------------------------------------------
  # NI 9226 — PT1000, three-wire. tt201..tt207 on ai0:6; ai7 not connected.
  #
  # READOUT UNIT FAILED, 28 September 2026: the NI 9226 itself is broken, so
  # every channel on it reads error. tt201 and tt203..tt207 are disabled for
  # the same reason tt202 is below - an alarm that is always on is one nobody
  # reads. WHEN THE MODULE IS REPLACED: remove the `enabled: false` from
  # tt201 and tt203..tt207 (tt202 stays off until its own sensor is replaced).
  # ------------------------------------------------------------------
  - {name: tt201, device: cdaq, phys: 9226/ai0, kind: rtd, unit: C, legacy: TT201,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "suction tube"}
  # SENSOR FAILED, 17 September 2026. Reads open-circuit: swings between roughly
  # -245 and +1327 C, identically to the unconnected 9226/ai7, where a working
  # sensor is stable to better than 0.5 C.
  #
  # Disabled rather than left enabled, deliberately. Enabled it would publish
  # quality=error every cycle and, from milestone 6, hold a permanent alarm —
  # and an alarm that is always on is one nobody reads. The failure is tracked
  # in DESIGN.md §16 instead, which is where it stays visible.
  #
  # WHEN THE SENSOR IS REPLACED: set enabled: true. Nothing else changes.
  - {name: tt202, device: cdaq, phys: 9226/ai1, kind: rtd, unit: C, legacy: TT202,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3},
     description: "bottom of the detector vessel - SENSOR FAILED 2026-09-17, awaiting replacement"}
  - {name: tt203, device: cdaq, phys: 9226/ai2, kind: rtd, unit: C, legacy: TT203,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "top of the bucket"}
  - {name: tt204, device: cdaq, phys: 9226/ai3, kind: rtd, unit: C, legacy: TT204,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "top of the bucket"}
  - {name: tt205, device: cdaq, phys: 9226/ai4, kind: rtd, unit: C, legacy: TT205,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "top of the bucket"}
  - {name: tt206, device: cdaq, phys: 9226/ai5, kind: rtd, unit: C, legacy: TT206,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "bottom of the bucket"}
  - {name: tt207, device: cdaq, phys: 9226/ai6, kind: rtd, unit: C, legacy: TT207,
     enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "bottom of the bucket"}
  - {name: spare_9226_ai7, device: cdaq, phys: 9226/ai7, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3750, r0: 1000.0, wiring: 3}, description: "not connected"}

  # ------------------------------------------------------------------
  # NI 9216_1 — PT100, three-wire. ai7 not connected.
  # ------------------------------------------------------------------
  - {name: tt301, device: cdaq, phys: 9216_1/ai0, kind: rtd, unit: C, legacy: TT301,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "pump inlet water"}
  - {name: tt302, device: cdaq, phys: 9216_1/ai1, kind: rtd, unit: C, legacy: TT302,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "pump outlet water"}
  - {name: tt103, device: cdaq, phys: 9216_1/ai2, kind: rtd, unit: C, legacy: TT103,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "pump inlet xenon"}
  - {name: tt104, device: cdaq, phys: 9216_1/ai3, kind: rtd, unit: C, legacy: TT104,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "pump outlet xenon"}
  # on_pid: false - the room temperature is not a point in the plant, so it
  # has no place on a piping drawing. Without this the mimic drift check would
  # report it as missing forever, and a warning that is always on is one
  # nobody reads.
  - {name: ttamb, device: cdaq, phys: 9216_1/ai4, kind: rtd, unit: C, legacy: TTamb,
     on_pid: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "ambient temperature"}
  - {name: tt303, device: cdaq, phys: 9216_1/ai5, kind: rtd, unit: C, legacy: TT303,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "inlet heat exchanger"}
  - {name: tt304, device: cdaq, phys: 9216_1/ai6, kind: rtd, unit: C, legacy: TT304,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "outlet heat exchanger"}
  - {name: spare_9216_1_ai7, device: cdaq, phys: 9216_1/ai7, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}

  # ------------------------------------------------------------------
  # NI 9216_2 — module entirely unconnected. Eight spare PT100 inputs already
