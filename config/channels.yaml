  - {name: spare_9216_2_ai1, device: cdaq, phys: 9216_2/ai1, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai2, device: cdaq, phys: 9216_2/ai2, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai3, device: cdaq, phys: 9216_2/ai3, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai4, device: cdaq, phys: 9216_2/ai4, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai5, device: cdaq, phys: 9216_2/ai5, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai6, device: cdaq, phys: 9216_2/ai6, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}
  - {name: spare_9216_2_ai7, device: cdaq, phys: 9216_2/ai7, kind: rtd, unit: C, enabled: false,
     rtd: {type: PT3851, r0: 100.0, wiring: 3}, description: "not connected"}

  # ------------------------------------------------------------------
  # CAEN hv_1 — serial 19198. All four channels negative polarity.
  #
  # `limits` is the SOFTWARE write range (§8.1) — convenience, not protection.
  # The board's own MAXV applies underneath regardless, and always wins.
  # `sign` records the polarity the board reports. The supplies return unsigned
  # magnitudes with POL separate, so the sign is applied in software and values
  # are STORED SIGNED (§7.2). Changing that convention later inverts history.
  # ------------------------------------------------------------------
  - {name: hv_pmt_bot_vmon, device: hv_1, phys: 0, kind: hv_vmon, unit: V, sign: -1,
     legacy: "PMT bot", limits: {min: -1100.0, max: 0.0}, description: "PMT bottom"}
  - {name: hv_pmt_bot_imon, device: hv_1, phys: 0, kind: hv_imon, unit: uA,
     description: "PMT bottom current"}
  - {name: hv_pmt_top_vmon, device: hv_1, phys: 1, kind: hv_vmon, unit: V, sign: -1,
     legacy: "PMT top", limits: {min: -1100.0, max: 0.0}, description: "PMT top"}
  - {name: hv_pmt_top_imon, device: hv_1, phys: 1, kind: hv_imon, unit: uA,
     description: "PMT top current"}
  - {name: hv_ts_vmon, device: hv_1, phys: 2, kind: hv_vmon, unit: V, sign: -1,
     legacy: "TS", limits: {min: -1710.0, max: 0.0}, description: "top screen"}
  - {name: hv_ts_imon, device: hv_1, phys: 2, kind: hv_imon, unit: uA,
     description: "top screen current"}
  - {name: hv_bs_vmon, device: hv_1, phys: 3, kind: hv_vmon, unit: V, sign: -1,
     legacy: "BS", limits: {min: -2000.0, max: 0.0}, description: "bottom screen"}
  - {name: hv_bs_imon, device: hv_1, phys: 3, kind: hv_imon, unit: uA,
     description: "bottom screen current"}

  # ------------------------------------------------------------------
  # CAEN hv_2 — serial 79. Cathode and gate negative; anode and NaI positive.
  # ------------------------------------------------------------------
  - {name: hv_cathode_vmon, device: hv_2, phys: 0, kind: hv_vmon, unit: V, sign: -1,
     legacy: "Cathode", limits: {min: -4000.0, max: 0.0}, description: "TPC cathode"}
  - {name: hv_cathode_imon, device: hv_2, phys: 0, kind: hv_imon, unit: uA,
     description: "TPC cathode current"}
  - {name: hv_gate_vmon, device: hv_2, phys: 1, kind: hv_vmon, unit: V, sign: -1,
     legacy: "Gate", limits: {min: -3750.0, max: 0.0}, description: "TPC gate"}
  - {name: hv_gate_imon, device: hv_2, phys: 1, kind: hv_imon, unit: uA,
     description: "TPC gate current"}
  - {name: hv_anode_vmon, device: hv_2, phys: 2, kind: hv_vmon, unit: V, sign: 1,
     legacy: "Anode", limits: {min: 0.0, max: 4500.0}, description: "TPC anode"}
  - {name: hv_anode_imon, device: hv_2, phys: 2, kind: hv_imon, unit: uA,
     description: "TPC anode current"}
  - {name: hv_nai_vmon, device: hv_2, phys: 3, kind: hv_vmon, unit: V, sign: 1,
     legacy: "NaI", limits: {min: 0.0, max: 1000.0}, description: "external NaI detector"}
  - {name: hv_nai_imon, device: hv_2, phys: 3, kind: hv_imon, unit: uA,
     description: "external NaI detector current"}

  # ------------------------------------------------------------------
  # CAEN channel STATUS words (§7.2)
  #
  # The board's own STAT bitmask per channel, stored as a number. Bit 0 is
  # the output being ENABLED and bit 10 its being DISABLED, and the two are
  # not the same question as "is there voltage on it":
  #
  #   17 Sep 2026, hv_1 ch1 — STAT=1 (ON), VSET=0.0, VMON=0.0
  #
  # That channel is switched on and sitting at zero volts. Inferring on/off
  # from VMON, as the web UI first did, calls that "off" and would call a
  # supply whose setpoint had been wound to zero "off" as well, when it is
  # live and one knob-turn from putting volts on an electrode.
  #
  # Storing the whole word rather than a decoded flag keeps TRIP, INTERLOCK,
  # OVER_CURRENT and OVER_TEMP available. They are on the same wire and cost
  # nothing extra to record, and alarming on them later (§16) needs no new
  # channel and so no gap in their history.
  # ------------------------------------------------------------------
  - {name: hv_pmt_bot_stat, device: hv_1, phys: 0, kind: hv_stat, unit: bits,
     description: "PMT bottom status word"}
  - {name: hv_pmt_top_stat, device: hv_1, phys: 1, kind: hv_stat, unit: bits,
     description: "PMT top status word"}
  - {name: hv_ts_stat, device: hv_1, phys: 2, kind: hv_stat, unit: bits,
     description: "top screen status word"}
  - {name: hv_bs_stat, device: hv_1, phys: 3, kind: hv_stat, unit: bits,
     description: "bottom screen status word"}
  - {name: hv_cathode_stat, device: hv_2, phys: 0, kind: hv_stat, unit: bits,
     description: "TPC cathode status word"}
  - {name: hv_gate_stat, device: hv_2, phys: 1, kind: hv_stat, unit: bits,
     description: "TPC gate status word"}
  - {name: hv_anode_stat, device: hv_2, phys: 2, kind: hv_stat, unit: bits,
     description: "TPC anode status word"}
  - {name: hv_nai_stat, device: hv_2, phys: 3, kind: hv_stat, unit: bits,
     description: "external NaI detector status word"}

  # ------------------------------------------------------------------
  # CAEN SETPOINTS (section 10a)
  #
  # What each channel has been TOLD to hold, as against VMON which is what it
  # is doing. Read with the ordinary monitor command; nothing writes these.
  #
  # WHY THIS IS WORTH A CHANNEL EACH. Switching a channel on is a hand
  # operation at the supply, and the board then ramps straight to whatever
  # VSET happens to be stored in it - a number set by somebody, at some point,
  # that until now was invisible from the lab. On 18 September 2026 every
  # channel was DISABLED and the stored setpoints were 700, 0, 500, 600, 2250,
  # 1750, 4200 and 600 V. Flipping the anode enable would have gone to 4.2 kV.
  #
  # Section 10a turns that into an invariant - a channel that is not enabled
  # has VSET 0 - and an invariant that cannot be observed is a wish. These
  # channels are what make it observable.
  #
  # `default_setpoint` is what "load defaults" offers on the HV page. These
  # are the values the boards were actually holding on 18 September 2026,
  # before they were zeroed - so they are the operating points as last left by
  # somebody, recovered from the hardware rather than invented here. Review
  # them: "what it was set to" and "what it should be set to" are not the same
  # question, and only the second one belongs in git.
  #
  # STORED SIGNED, like VMON (section 7.2). The supplies report an unsigned
  # magnitude with POL separate, so the cathode's 2250 is written here as
  # -2250. `limits` is the signed software write range, present now so that
  # the write path of stage 2 has it: a channel with no limits refuses every
  # write, which is the intended default.
  # ------------------------------------------------------------------
  - {name: hv_pmt_bot_vset, device: hv_1, phys: 0, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -1100.0, max: 0.0}, default_setpoint: -700.0, description: "PMT bottom setpoint"}
  - {name: hv_pmt_top_vset, device: hv_1, phys: 1, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -1100.0, max: 0.0}, default_setpoint: 0.0, description: "PMT top setpoint"}
  - {name: hv_ts_vset, device: hv_1, phys: 2, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -1710.0, max: 0.0}, default_setpoint: -500.0, description: "top screen setpoint"}
  - {name: hv_bs_vset, device: hv_1, phys: 3, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -2000.0, max: 0.0}, default_setpoint: -600.0, description: "bottom screen setpoint"}
  - {name: hv_cathode_vset, device: hv_2, phys: 0, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -3500.0, max: 0.0}, default_setpoint: -2250.0, description: "TPC cathode setpoint"}
  - {name: hv_gate_vset, device: hv_2, phys: 1, kind: hv_vset, unit: V, sign: -1,
     limits: {min: -3750.0, max: 0.0}, default_setpoint: -1750.0, description: "TPC gate setpoint"}
  - {name: hv_anode_vset, device: hv_2, phys: 2, kind: hv_vset, unit: V, sign: 1,
     limits: {min: 0.0, max: 4500.0}, default_setpoint: 4200.0, description: "TPC anode setpoint"}
  - {name: hv_nai_vset, device: hv_2, phys: 3, kind: hv_vset, unit: V, sign: 1,
     limits: {min: 0.0, max: 1000.0}, default_setpoint: 600.0, description: "external NaI detector setpoint"}

  # ------------------------------------------------------------------
  # Lake Shore 335
  # ------------------------------------------------------------------
  # UNIT IS CELSIUS, not Kelvin. An earlier draft of this file said K; the
  # imported LabVIEW history then showed these channels ranging from -90 to
  # +21.8, and there is no such thing as a negative Kelvin. They also track
  # the cryostat RTDs (tt206/tt207) closely, which settles it.
  #
  # The driver therefore reads CRDG? (Celsius), not KRDG? (Kelvin). This is
  # the same failure as the flow meter labelled "SLPM" (section 4.2): the
  # number was right and the label was wrong. Do not "correct" it back.
  - {name: tt401, device: lakeshore, phys: A, kind: temperature, unit: C,
     description: "Lake Shore input A"}
  - {name: tt402, device: lakeshore, phys: B, kind: temperature, unit: C,
     description: "Lake Shore input B"}
  - {name: ls_heater_1, device: lakeshore, phys: "1", kind: status, unit: percent,
     description: "Lake Shore heater output 1"}
  - {name: ls_heater_2, device: lakeshore, phys: "2", kind: status, unit: percent,
     description: "Lake Shore heater output 2"}

  # The control setpoints, READ. The loop runs in the instrument; this only
  # records what it was told to hold, so the landing page can show the
  # temperature next to the temperature that was asked for. A setpoint sitting
  # where nobody can see it is how a heater ends up chasing a number somebody
  # typed last month.
  #
  # Reading these is not the control path (section 10) and does not depend on
  # it: `SETP?` is a query, and the driver has no SET command in it.
  #
  # `limits` is the SOFTWARE write range (section 8.1) and it is what makes a
  # setpoint writable at all: a channel with no limits refuses every write,
  # because a range nobody specified is not permission to write anything.
  #
  # DELIBERATELY CONSERVATIVE. The working points are -90 and -100 C, and the
  # floor is LN2. The ceiling is 0 C, which covers all cryogenic operation and
  # stops a mistyped sign warming the cryostat: -25 typed as 25 is refused
  # rather than obeyed. Warming to ambient is a real procedure but a rare and
  # consequential one, and it should take a deliberate edit of this line
  # rather than a number typed into a web form.
  - {name: ls_setpoint_1, device: lakeshore, phys: "1", kind: setpoint, unit: C,
     limits: {min: -196.0, max: 0.0},
     description: "Lake Shore setpoint, output 1"}
  - {name: ls_setpoint_2, device: lakeshore, phys: "2", kind: setpoint, unit: C,
     limits: {min: -196.0, max: 0.0},
     description: "Lake Shore setpoint, output 2"}

  # Heater output in watts, derived from the percentage above.
  #
  #     volts = percent / 100 * full_scale_v
  #     watts = volts^2 / resistance_ohm
  #
  # Quadratic, so it cannot be written as an offset and a multiplier - hence a
  # named transform rather than ordinary scaling. The percentage is kept as its
  # own channel and is the instrument's own number; this is derived from it and
  # can always be recomputed.
  #
  # The constants describe the heater at its present range setting (3, high).
  # The 335 switches heater range in roughly tenfold power steps, so changing
  # the range on the front panel makes these watts wrong by about that factor
  # while the percentage stays plausible. A range guard was offered and
  # declined on 17 Sep 2026; noted here so a surprising wattage has an obvious
  # first place to look.
  - name: ls_heater_1_w
    device: lakeshore
    phys: "1"
    kind: power
    unit: W
    derive: {from: ls_heater_1, transform: heater_power,
             full_scale_v: 45.4, resistance_ohm: 31.2}
    description: "Lake Shore heater output 1, in watts"
  - name: ls_heater_2_w
    device: lakeshore
    phys: "2"
    kind: power
    unit: W
    derive: {from: ls_heater_2, transform: heater_power,
             full_scale_v: 45.4, resistance_ohm: 31.2}
    description: "Lake Shore heater output 2, in watts"

  # ------------------------------------------------------------------
  # UPS — APC over USB HID
  # ------------------------------------------------------------------
  - {name: ups_on_battery, device: ups, phys: on_battery, kind: status, unit: bool,
     description: "1 when running on battery, 0 on line power"}
  - {name: ups_battery_pct, device: ups, phys: battery_pct, kind: status, unit: percent,
     description: "battery charge"}
  - {name: ups_runtime_min, device: ups, phys: runtime_min, kind: status, unit: min,
     description: "estimated runtime remaining"}

  # ------------------------------------------------------------------
  # Turbo pump - Pfeiffer HiPace 80, LISTENED TO on its RS-485 link with the
  # HiCube DCU (devices.yaml `turbo`, docs/drivers/turbo.md). `phys` is the
  # Pfeiffer parameter number.
  #
  # Only what the DCU polls is on the bus: the status set always, the speed
  # (309) only while it is on the DCU display or service line (DCU 795 = 309,
  # set 2026-10-08). A parameter the DCU stops polling is published as
  # quality=error, not left at its last value.
  #
  # On the P&ID: the speed beside the "Turbopump" label, and the symbol's
  # outline coloured from the status channels (tools/build_mimic.py SYMBOLS).
  # The status channels themselves have no slot of their own.
  # ------------------------------------------------------------------
  - {name: turbo_on, device: turbo, phys: "010", kind: status, unit: bool, on_pid: false,
     description: "turbo pumping station on (Pfeiffer 010 PumpgStatn)"}
  - {name: turbo_at_speed, device: turbo, phys: "306", kind: status, unit: bool, on_pid: false,
     description: "turbo at set speed (Pfeiffer 306 SetSpdAtt)"}
  - {name: turbo_accelerating, device: turbo, phys: "307", kind: status, unit: bool, on_pid: false,
     description: "turbo accelerating (Pfeiffer 307 PumpAccel)"}
  - {name: turbo_error, device: turbo, phys: "303", kind: status, unit: code, on_pid: false,
     description: "turbo error / warning number, 0 = none (Pfeiffer 303); text in turbo.log"}
  - {name: turbo_overtemp_elec, device: turbo, phys: "304", kind: status, unit: bool, on_pid: false,
     description: "turbo electronics over temperature (Pfeiffer 304 OvTempElec)"}
  - {name: turbo_overtemp_pump, device: turbo, phys: "305", kind: status, unit: bool, on_pid: false,
     description: "turbo pump over temperature (Pfeiffer 305 OvTempPump)"}
  - {name: turbo_speed, device: turbo, phys: "309", kind: status, unit: Hz,
     description: "turbo rotation speed (Pfeiffer 309 ActualSpd); needs DCU service line or display on 309"}

  # ------------------------------------------------------------------
  # Residual gas analyser, Pfeiffer PrismaPro (devices.yaml `rga`,
  # docs/drivers/rga.md). STATUS ONLY: what the analyser is doing, never its
  # spectra - those are saved by hand, one file per measurement, and never
  # become channels. `phys` is the MMSP target read (or, for `emission` and
  # `control`, what is derived from one).
  #
  # Not on the P&ID: the analyser's state has no place on a piping drawing.
  # ------------------------------------------------------------------
  - {name: rga_emission, device: rga, phys: emission, kind: status, unit: bool, on_pid: false,
     description: "RGA emission on (systemStatus bit 31 or 30)"}
  - {name: rga_control, device: rga, phys: control, kind: status, unit: code, on_pid: false,
     description: "RGA control: 0 nobody, 1 this system, 2 another client (PV MassSpec, web UI); who on the RGA page"}
  - {name: rga_status, device: rga, phys: status/systemStatus, kind: status, unit: bits, on_pid: false,
     description: "RGA systemStatus word (bits in docs/drivers/rga.md)"}
  - {name: rga_hw_errors, device: rga, phys: status/hardwareErrors, kind: status, unit: bits, on_pid: false,
     description: "RGA hardware errors, 0 = none"}
  - {name: rga_hw_warnings, device: rga, phys: status/hardwareWarnings, kind: status, unit: bits, on_pid: false,
     description: "RGA hardware warnings, 0 = none"}
  - {name: rga_tp_trips, device: rga, phys: sensorIonSource/tpTripCount, kind: status, unit: code, on_pid: false,
     description: "RGA lifetime count of emission switched off by its own over-pressure trip"}
  - {name: rga_box_temp, device: rga, phys: diagnosticData/internalBoxTemperature, kind: temperature, unit: C, on_pid: false,
     description: "RGA electronics box internal temperature"}

  # ------------------------------------------------------------------
  # Derived (§7.5). Not read from hardware; computed by devices/derived.py.
  # ------------------------------------------------------------------
  - {name: fm101_total, device: derived, phys: "integrate:fm101", kind: voltage, unit: g,
     description: "integrated mass through fm101 since the period start"}
